name: Final verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: final-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.11 - ${{ matrix.os }} - 394 tests and runtime smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Frozen files and exact test inventory
        run: python ci/verify_inventory.py
      - name: Compile all Python source
        run: python -m compileall -q .
      - name: Run all old and new unittest tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -v 2>&1 | tee unittest.log
      - name: Verify actual 78 old + 102 safety + 89 UI + 73 multi-user + 32 quick input + 20 reward input passed without skips
        run: python ci/verify_inventory.py --results unittest.log
      - name: Real imports and mocked handler integration - no live services
        run: python ci/verify_runtime.py
